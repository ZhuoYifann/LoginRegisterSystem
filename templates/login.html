

{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign In</title>

    <link href="https://fonts.googleapis.com/css2?family=Crimson+Text:wght@400;600&family=Source+Serif+4:wght@600&display=swap" rel="stylesheet">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Crimson Text', serif;
            background: white;
        }

        .container {
            display: flex;
            width: 100%;
            min-height: 100vh;
        }

        .left-panel {
            width: 560px;
            min-height: 100vh;
            flex-shrink: 0;
            background: rgba(102, 164, 245, 0.5);
            padding: 125px 51px;
        }

        .left-panel h1 {
            font-family: 'Source Serif 4', serif;
            font-size: 60px;
            line-height: 1.15;
            margin-bottom: 85px;
        }

        .left-panel p {
            font-size: 30px;
            line-height: 1.4;
        }

        .right-panel {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .login-form {
            width: 520px;
        }

        .login-form h2 {
            font-family: 'Source Serif 4', serif;
            font-size: 40px;
            margin-bottom: 60px;
        }

        .form-group {
            margin-bottom: 14px;
        }

        .form-group label {
            display: block;
            font-size: 18px;
            margin-bottom: 10px;
        }

        .form-group input {
            width: 100%;
            height: 48px;
            border: 1px solid black;
            border-radius: 8px;
            padding: 0 15px;
            font-family: 'Crimson Text', serif;
            font-size: 18px;
        }

        .options {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin: 22px 0;
            font-size: 16px;
        }

        .options a, .signup a {
            color: #273a92;
        }

        .login-button {
            width: 100%;
            height: 52px;
            background: #b2d1f9;
            border: none;
            border-radius: 10px;
            font-family: 'Crimson Text', serif;
            font-size: 18px;
            cursor: pointer;
        }

        .signup {
            text-align: center;
            margin-top: 45px;
            font-size: 18px;
        }

        .error {
            color: red;
            margin-bottom: 15px;
        }

        @media (max-width: 900px) {
            .container {
                flex-direction: column;
            }

            .left-panel {
                width: 100%;
                min-height: auto;
                padding: 45px 30px;
            }

            .left-panel h1 {
                font-size: 45px;
                margin-bottom: 25px;
            }

            .left-panel p {
                font-size: 23px;
            }

            .right-panel {
                padding: 50px 25px;
            }

            .login-form {
                width: 100%;
                max-width: 520px;
            }
        }
    </style>
</head>

<body>

<div class="container">

    <div class="left-panel">
        <h1>Welcome Back!</h1>
        <p>
            Log in to your account and pick up right where you left off.
            It's good to have you back!
        </p>
    </div>

    <div class="right-panel">
        <div class="login-form">

            <h2>Log In to your Account</h2>

            {% if error %}
                <p class="error">{{ error }}</p>
            {% endif %}

            <form method="POST">
                {% csrf_token %}

                <div class="form-group">
                    <label>Email Address</label>
                    <input type="text" name="username"
                           placeholder="Enter your email address" required>
                </div>

                <div class="form-group">
                    <label>Password</label>
                    <input type="password" name="password"
                           placeholder="Enter your password" required>
                </div>

                <div class="options">
                    <label>
                        <input type="checkbox" name="remember">
                        Remember me
                    </label>

                    <a href="#">Forgot Password?</a>
                </div>

                <button type="submit" class="login-button">
                    Sign In
                </button>
            </form>

            <p class="signup">
                Don't have an account?
                <a href="{% url 'register' %}">Sign Up</a>
            </p>

        </div>
    </div>

</div>

</body>
</html>
